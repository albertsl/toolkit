<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maps</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style>
        #myMap {
            height: 500px; /* Define a height for your map */
            width: 100%;
        }
    </style>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>
<body>
    <div id="myMap"></div>
    <script>
        // Map setup
        var mymap = L.map('myMap').setView([40, -3], 6);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(mymap);

        // Add a marker
        var marker = L.marker([40, -3]).addTo(mymap)
            .bindPopup("<b>Hello!</b><br>World").openPopup();
        
        // Add many markers
        fetch('data.json')
            .then(response => response.json())
            .then(data => {
                console.log(data);
                data.forEach(city => {
                    name = city.name
                    console.log(name)
                    lat = city.lat
                    lng = city.lng
                    L.marker([lat, lng]).addTo(mymap).bindPopup("<b>" + name + "</b><br>" + city.population);
                });
            })
            .catch(error => {
                console.error('Error loading JSON file:', error);
            });
    </script>
</body>
</html>
